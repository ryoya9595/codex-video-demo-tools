<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>見積書・請求書 自動生成 | Codex Demo</title>
    <link rel="stylesheet" href="tool.css" />
  </head>
  <body>
    <main class="tool-shell">
      <header class="tool-header">
        <div>
          <p class="kicker">Estimate / Invoice</p>
          <h1>見積書・請求書 自動生成</h1>
        </div>
        <div class="status-pill" id="statusPill">Ready</div>
      </header>

      <section class="two-column">
        <form class="panel" id="invoiceForm">
          <div class="field-grid">
            <label>
              <span>クライアント名</span>
              <input name="client" value="株式会社ラッキーマイン" />
            </label>
            <label>
              <span>案件名</span>
              <input name="project" value="AI副業講座 LP改善支援" />
            </label>
            <label>
              <span>金額</span>
              <input name="amount" type="number" value="300000" />
            </label>
            <label>
              <span>税率</span>
              <select name="tax">
                <option value="0.1">10%</option>
                <option value="0.08">8%</option>
                <option value="0">なし</option>
              </select>
            </label>
            <label>
              <span>発行日</span>
              <input name="issueDate" type="date" />
            </label>
            <label>
              <span>支払期限</span>
              <input name="dueDate" type="date" />
            </label>
          </div>
          <label>
            <span>作業内容</span>
            <textarea name="items" rows="5">競合調査
LP構成改善
AI導線設計
改善レポート作成</textarea>
          </label>
          <div class="actions">
            <button class="secondary" type="button" id="invoiceSampleButton">サンプル入力</button>
            <button type="submit">書類を生成</button>
          </div>
        </form>

        <div class="document-stack">
          <article class="document" id="estimateDoc"></article>
          <article class="document" id="invoiceDoc"></article>
        </div>
      </section>
    </main>
    <script src="estimate-invoice.js"></script>
  </body>
</html>
