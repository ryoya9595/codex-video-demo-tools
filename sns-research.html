<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>競合SNSリサーチツール | Codex Demo</title>
    <link rel="stylesheet" href="tool.css" />
  </head>
  <body>
    <main class="tool-shell">
      <header class="tool-header">
        <div>
          <p class="kicker">SNS Research</p>
          <h1>競合SNSリサーチツール</h1>
        </div>
        <div class="status-pill" id="statusPill">Ready</div>
      </header>

      <section class="panel">
        <div class="research-controls">
          <div class="segmented" id="snsTabs" role="tablist" aria-label="SNS">
            <button class="is-active" type="button" data-sns="YouTube">YouTube</button>
            <button type="button" data-sns="Instagram">Instagram</button>
            <button type="button" data-sns="Threads">Threads</button>
            <button type="button" data-sns="note">note</button>
          </div>
          <form id="researchForm" class="inline-research">
            <input name="target" value="AI副業 チャンネル" />
            <button type="submit">リサーチ開始</button>
          </form>
        </div>

        <div class="research-output">
          <section>
            <h2 id="researchTitle">YouTube分析</h2>
            <div class="metric-grid" id="metricGrid"></div>
          </section>
          <section>
            <h2>伸びている切り口</h2>
            <div class="insight-list" id="insightList"></div>
          </section>
          <section>
            <h2>次に試す投稿案</h2>
            <div class="idea-list" id="ideaList"></div>
          </section>
        </div>
      </section>
    </main>
    <script src="sns-research.js"></script>
  </body>
</html>
