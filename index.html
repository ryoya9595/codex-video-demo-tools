<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Codex Demo Tools</title>
    <link rel="stylesheet" href="tool.css" />
  </head>
  <body>
    <main class="tool-shell">
      <header class="tool-header">
        <div>
          <p class="kicker">Codex Demo</p>
          <h1>撮影用ビジネスツール</h1>
        </div>
        <div class="status-pill">3 tools</div>
      </header>

      <section class="landing-grid">
        <a class="landing-card" href="estimate-invoice.html">
          <div>
            <p class="kicker">Estimate / Invoice</p>
            <h2>見積書・請求書 自動生成</h2>
          </div>
          <p>クライアント名、案件名、金額を入力すると、見積書と請求書を同時に生成。</p>
        </a>
        <a class="landing-card" href="sns-research.html">
          <div>
            <p class="kicker">SNS Research</p>
            <h2>競合SNSリサーチツール</h2>
          </div>
          <p>YouTube、Instagram、Threads、noteの切り口を切り替えて分析。</p>
        </a>
        <a class="landing-card" href="youtube-script-thumbnail.html">
          <div>
            <p class="kicker">Script / Thumbnail</p>
            <h2>YouTube台本・サムネ案 自動生成</h2>
          </div>
          <p>テーマを入れると、動画構成、台本、サムネ案をまとめて生成。</p>
        </a>
      </section>
    </main>
  </body>
</html>
