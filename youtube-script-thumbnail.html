<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YouTube台本・サムネ案 自動生成 | Codex Demo</title>
    <link rel="stylesheet" href="tool.css" />
  </head>
  <body>
    <main class="tool-shell">
      <header class="tool-header">
        <div>
          <p class="kicker">Script / Thumbnail</p>
          <h1>YouTube台本・サムネ案 自動生成</h1>
        </div>
        <div class="status-pill" id="statusPill">Ready</div>
      </header>

      <section class="two-column">
        <form class="panel" id="youtubeForm">
          <label>
            <span>テーマ</span>
            <input name="theme" value="CodexでAI副業の作業を自動化する方法" />
          </label>
          <div class="field-grid">
            <label>
              <span>視聴者</span>
              <select name="audience">
                <option>AI副業初心者</option>
                <option>中級者・講師</option>
                <option>フリーランス</option>
              </select>
            </label>
            <label>
              <span>トーン</span>
              <select name="tone">
                <option>初心者向けにやさしく</option>
                <option>危機感強め</option>
                <option>実演多め</option>
              </select>
            </label>
          </div>
          <label>
            <span>入れたい要素</span>
            <textarea name="points" rows="5">月20ドルで追加課金なし
画像生成
コンピューターUSE
ビジネスツール実演
セキュリティ設定特典</textarea>
          </label>
          <div class="actions">
            <button type="submit">台本とサムネ案を生成</button>
          </div>
        </form>

        <div class="youtube-output">
          <section class="panel" id="scriptOutput"></section>
          <section class="panel" id="thumbnailOutput"></section>
        </div>
      </section>
    </main>
    <script src="youtube-script-thumbnail.js"></script>
  </body>
</html>
